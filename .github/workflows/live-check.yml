name: Live site check

on:
  push:
    branches: [arena/54180390-openmontage]
    paths: ['a1-tour-and-travels/**', '.github/workflows/live-check.yml']
  schedule:
    - cron: '0 4 * * 1'      # every Monday 04:00 UTC — free uptime monitoring
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the public site (content, security, assets)
        run: |
          set +e
          SHA=$(git rev-parse HEAD)
          BR=arena/54180390-openmontage
          GH="https://snazim0345.github.io/OpenMontage"
          BASE="https://raw.githack.com/snazim0345/OpenMontage/$BR/a1-tour-and-travels"
          URL="$GH/"                       # PRIMARY: GitHub Pages (real hosting, HTTPS)
          SHARE_URL="$BASE/index.html"     # BACKUP: CDN link
          mkdir -p .diagnostics
          {
            echo "live site check — $(date -u)"
            echo "PRIMARY  (GitHub Pages): $URL"
            echo "BACKUP   (CDN):          $SHARE_URL"
            echo "backup status:           $(curl -sL -o /dev/null -m 45 -w '%{http_code} %{size_download} bytes' "$SHARE_URL")"
            echo "local file size:         $(wc -c < a1-tour-and-travels/index.html)"
            code=$(curl -sL -o /tmp/page.html -m 45 -w '%{http_code}' "$URL")
            echo "http:  $code"
            echo "type:  $(curl -sIL -m 45 "$URL" | grep -i '^content-type' | tail -1)"
            echo "bytes: $(wc -c < /tmp/page.html)"
            echo
            echo "== content essentials =="
            ok=1
            for s in "A1 Tour and Travels" "7888007234" "Pune ↔ Mumbai Cabs" "wa.me/917888007234" \
                     "Pune ↔ Mumbai Travel Questions" "TaxiService" "FAQPage"; do
              if grep -qF "$s" /tmp/page.html; then echo "  OK      $s"; else echo "  MISSING $s"; ok=0; fi
            done
            echo
            echo "== security hardening present =="
            for s in "Content-Security-Policy" "noopener noreferrer" "rel=\"manifest\"" "<noscript>"; do
              if grep -qF "$s" /tmp/page.html; then echo "  OK      $s"; else echo "  MISSING $s"; ok=0; fi
            done
            echo "  external <script src> count: $(grep -o '<script src=' /tmp/page.html | wc -l)  (0 = no third-party JS)"
            echo
            echo "== assets / app files served with correct types =="
            for f in index.html 404.html manifest.json sw.js sitemap.xml robots.txt 404.html \
                     assets/icon-192.png assets/icon-512.png assets/apple-touch-icon.png \
                     assets/qr-whatsapp.png _headers; do
              printf "  %-32s" "$f"
              curl -sL -o /dev/null -m 30 -w "http=%{http_code} type=%{content_type} bytes=%{size_download}\n" "$GH/$f"
            done
            echo
            echo "== external assets the page needs =="
            grep -o 'https://images\.unsplash\.com/[^"?]*' /tmp/page.html | sort -u | while read -r u; do
              printf "  %-70s" "$u"
              curl -sL -o /dev/null -m 25 -w "http=%{http_code} type=%{content_type}\n" "$u?auto=format&fit=crop&w=400&q=60"
            done
            echo
            [ "$code" = "200" ] && [ "$ok" = "1" ] && echo "RESULT: PASS" || echo "RESULT: FAIL"
            echo "$(date -u +%F) http=$code pass=$ok" >> .diagnostics/live-history.txt
            echo
            echo "== security headers actually served by GitHub Pages (informational) =="
            curl -sI -m 30 "$GH/" | grep -iE "^(strict-transport|content-security|x-frame|x-content-type|referrer-policy|permissions-policy)" || echo "  (GitHub Pages does not set custom HTTP headers — the <meta> CSP still applies; use Netlify/Cloudflare for server-enforced headers)"
          } > .diagnostics/live-check.txt 2>&1
          cat .diagnostics/live-check.txt
          BR=arena/54180390-openmontage
          git config user.name site-bot
          git config user.email site-bot@users.noreply.github.com
          git add -f .diagnostics a1-tour-and-travels/assets 2>/dev/null
          git commit -q -m "bot: update diagnostics $(date -u +%FT%TZ)" || echo "no changes to commit"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "$BR" >/dev/null 2>&1 && git push origin HEAD:"$BR" 2>&1 | tail -2; then
              echo "push attempt $attempt: OK"
              break
            else
              echo "push attempt $attempt: rejected, retrying..."
              sleep 6
            fi
          done
          echo "final state: $(git rev-parse --short HEAD)"

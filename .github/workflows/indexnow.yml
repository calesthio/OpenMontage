name: Submit site to search engines (IndexNow)

# AUTOMATIC SEARCH SUBMISSION — switches itself on as soon as you have a real host.
#
# IndexNow instantly notifies Bing, Yandex, Seznam and DuckDuckGo that the site
# changed, so they re-crawl within minutes instead of weeks. It is free and needs
# no account. It requires the site to be served from a host you control, and a
# small key file that proves ownership — both of which GitHub Pages or Netlify give you.
#
# This workflow does nothing until you set ONE repository variable:
#     Settings → Secrets and variables → Actions → Variables → New variable
#         SITE_URL = https://snazim0345.github.io/OpenMontage   (or your domain)
# Until then it exits immediately and costs nothing.

on:
  push:
    branches: [arena/54180390-openmontage]
    paths: ['indexnow-trigger.txt']
  schedule:
    - cron: '0 5 * * 1'      # weekly, Mondays
  workflow_dispatch:

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the site URL (no manual setup needed)
        id: gate
        run: |
          # Uses the SITE_URL repository variable when present, and otherwise falls
          # back to the live GitHub Pages address — so this works with zero setup.
          SITE="${{ steps.gate.outputs.site }}"
          if [ -z "$SITE" ]; then SITE="https://snazim0345.github.io/OpenMontage"; fi
          echo "Submitting URLs under: $SITE"
          echo "site=$SITE" >> $GITHUB_OUTPUT
          echo "ready=true" >> $GITHUB_OUTPUT

      - name: Generate the ownership key file (once)
        if: steps.gate.outputs.ready == 'true'
        run: |
          KEY_FILE=$(ls a1-tour-and-travels/*.txt 2>/dev/null | grep -E '/[0-9a-f]{16,}\.txt$' | head -1)
          if [ -z "$KEY_FILE" ]; then
            KEY=$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')
            echo "$KEY" > "a1-tour-and-travels/$KEY.txt"
            echo "created key file: $KEY.txt"
          else
            KEY=$(basename "$KEY_FILE" .txt)
            echo "reusing key file: $KEY_FILE"
          fi
          echo "KEY=$KEY" >> $GITHUB_ENV
          BR=arena/54180390-openmontage
          git config user.name site-bot
          git config user.email site-bot@users.noreply.github.com
          git add -f .diagnostics a1-tour-and-travels/assets 2>/dev/null
          git commit -q -m "bot: update diagnostics $(date -u +%FT%TZ)" || echo "no changes to commit"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "$BR" >/dev/null 2>&1 && git push origin HEAD:"$BR" 2>&1 | tail -2; then
              echo "push attempt $attempt: OK"
              break
            else
              echo "push attempt $attempt: rejected, retrying..."
              sleep 6
            fi
          done
          echo "final state: $(git rev-parse --short HEAD)"

      - name: Submit URLs to IndexNow
        if: steps.gate.outputs.ready == 'true'
        run: |
          HOST=$(echo "${{ steps.gate.outputs.site }}" | sed -E 's#https?://([^/]+).*#\1#')
          cat > /tmp/body.json <<JSON
          {
            "host": "$HOST",
            "key": "$KEY",
            "keyLocation": "${{ steps.gate.outputs.site }}/$KEY.txt",
            "urlList": [
              "${{ steps.gate.outputs.site }}/",
              "${{ steps.gate.outputs.site }}/index.html",
              "${{ steps.gate.outputs.site }}/sitemap.xml"
            ]
          }
          JSON
          echo "posting to IndexNow:"
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d @/tmp/body.json -w "\nhttp=%{http_code}\n" | tee /tmp/indexnow.txt
          mkdir -p .diagnostics
          echo "$(date -u) host=$HOST response: $(cat /tmp/indexnow.txt)" >> .diagnostics/indexnow-log.txt
          BR=arena/54180390-openmontage
          git config user.name site-bot
          git config user.email site-bot@users.noreply.github.com
          git add -f .diagnostics a1-tour-and-travels/assets 2>/dev/null
          git commit -q -m "bot: update diagnostics $(date -u +%FT%TZ)" || echo "no changes to commit"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "$BR" >/dev/null 2>&1 && git push origin HEAD:"$BR" 2>&1 | tail -2; then
              echo "push attempt $attempt: OK"
              break
            else
              echo "push attempt $attempt: rejected, retrying..."
              sleep 6
            fi
          done
          echo "final state: $(git rev-parse --short HEAD)"

[pytest]
# Repo-root pytest config.
#
# The nested youtube-niche-finder checkout is a separate project (its backend
# imports psycopg2, which this environment does not install). Collecting it
# used to abort `pytest --collect-only` at the repo root, so it is excluded
# here instead of relying on every caller to pass explicit paths.
#
# norecursedirs replaces pytest's defaults, so the default entries are kept.
norecursedirs =
    .*
    *.egg
    _darcs
    build
    CVS
    dist
    node_modules
    venv
    {arch}
    youtube-niche-finder
    remotion-composer
    projects

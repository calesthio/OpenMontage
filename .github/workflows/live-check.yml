name: Live site check

on:
  push:
    branches: [arena/54180390-openmontage]
    paths: ['a1-tour-and-travels/**', '.github/workflows/live-check.yml', 'live-trigger.txt']
  schedule:
    - cron: '0 4 * * 1'      # every Monday 04:00 UTC — free uptime monitoring
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the public site (every page, security, assets)
        run: |
          set +e
          GH="https://snazim0345.github.io/OpenMontage"
          URL="$GH/"
          mkdir -p .diagnostics
          {
            echo "live site check — $(date -u)"
            echo "PRIMARY (GitHub Pages): $URL"
            echo "local index.html size:  $(wc -c < a1-tour-and-travels/index.html)"
            code=$(curl -sL -o /tmp/page.html -m 45 -w '%{http_code}' "$URL")
            echo "http:  $code"
            echo "type:  $(curl -sIL -m 45 "$URL" | grep -i '^content-type' | tail -1)"
            echo "bytes: $(wc -c < /tmp/page.html)"
            echo
            echo "== content essentials =="
            ok=1
            for s in "A1 Tour and Travels" "7888007234" "Pune ↔ Mumbai Cabs" "wa.me/917888007234" \
                     "Pune ↔ Mumbai Travel Questions" "TaxiService" "FAQPage"; do
              if grep -qF "$s" /tmp/page.html; then echo "  OK      $s"; else echo "  MISSING $s"; ok=0; fi
            done
            echo
            echo "== security hardening present =="
            for s in "Content-Security-Policy" "noopener noreferrer" "rel=\"manifest\"" "<noscript>"; do
              if grep -qF "$s" /tmp/page.html; then echo "  OK      $s"; else echo "  MISSING $s"; ok=0; fi
            done
            echo "  external <script src> count: $(grep -o '<script src=' /tmp/page.html | wc -l)  (0 = no third-party JS)"
            echo
            echo "== EVERY page in the sitemap, fetched from the live site =="
            fails=0
            for u in $(grep -o '<loc>[^<]*' a1-tour-and-travels/sitemap.xml | sed 's/<loc>//'); do
              p=${u#https://snazim0345.github.io/OpenMontage/}
              [ -z "$p" ] && p="index.html"
              printf "  %-42s" "/$p"
              curl -sL -o /tmp/p.html -m 40 -w "http=%{http_code} " "$u"
              echo -n "bytes=$(wc -c < /tmp/p.html) "
              grep -o '<title>[^<]*' /tmp/p.html | head -1 | sed 's/<title>//' | cut -c1-44
              c=$(curl -sL -o /dev/null -m 40 -w '%{http_code}' "$u")
              [ "$c" = "200" ] || { echo "     ^^ THIS PAGE IS NOT SERVING (http=$c)"; fails=$((fails+1)); }
            done
            echo "  pages not serving: $fails"
            [ "$fails" = "0" ] || ok=0
            echo
            echo "== assets / app files served with correct types =="
            for f in manifest.json sw.js sitemap.xml robots.txt 404.html post-ads.html \
                     marketing/print-kit.html assets/share.js assets/icon-192.png assets/icon-512.png \
                     assets/apple-touch-icon.png assets/qr-whatsapp.png assets/qr-website.png \
                     assets/ads/ad-main-square.png assets/ads/ad-matchcab-square.png \
                     assets/ads/ad-airport-square.png assets/ads/ad-nosurge-square.png \
                     assets/ads/ad-status-fares.png assets/ads/ad-status-group.png _headers; do
              printf "  %-40s" "$f"
              curl -sL -o /dev/null -m 30 -w "http=%{http_code} type=%{content_type} bytes=%{size_download}\n" "$GH/$f"
            done
            echo
            echo "== branded short links (these must never break) =="
            for l in "https://tinyurl.com/a1tourstravels" "https://spoo.me/a1toursandtravel" "https://tinyurl.com/a1toursandtravel"; do
              printf "  %-42s" "$l"
              curl -sL -o /tmp/l.html -m 40 -w "http=%{http_code} " "$l"
              echo -n "lands_on=$(curl -sL -o /dev/null -m 40 -w '%{url_effective}' "$l" | cut -c1-58) "
              if grep -q '7888007234' /tmp/l.html; then echo "brand=YES"; else echo "brand=NO (do not use this link publicly)"; fi
            done
            echo
            echo "== external assets the page needs =="
            grep -o 'https://images\.unsplash\.com/[^"?]*' /tmp/page.html | sort -u | while read -r u; do
              printf "  %-70s" "$u"
              curl -sL -o /dev/null -m 25 -w "http=%{http_code} type=%{content_type}\n" "$u?auto=format&fit=crop&w=400&q=60"
            done
            echo
            [ "$code" = "200" ] && [ "$ok" = "1" ] && echo "RESULT: PASS" || echo "RESULT: FAIL"
            echo "$(date -u +%F) http=$code pass=$ok pages_not_serving=$fails" >> .diagnostics/live-history.txt
            echo
            echo "== security headers actually served by GitHub Pages (informational) =="
            curl -sI -m 30 "$GH/" | grep -iE "^(strict-transport|content-security|x-frame|x-content-type|referrer-policy|permissions-policy)" || echo "  (GitHub Pages does not set custom HTTP headers — the <meta> CSP still applies; use Netlify/Cloudflare for server-enforced headers)"
          } > .diagnostics/live-check.txt 2>&1
          cat .diagnostics/live-check.txt
          BR=arena/54180390-openmontage
          git config user.name site-bot
          git config user.email site-bot@users.noreply.github.com
          git add -f .diagnostics
          git commit -q -m "bot: update diagnostics $(date -u +%FT%TZ)" || echo "no changes to commit"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "$BR" >/dev/null 2>&1 && git push origin HEAD:"$BR" 2>&1 | tail -2; then
              echo "push attempt $attempt: OK"; break
            else
              echo "push attempt $attempt: rejected, retrying..."; sleep 6
            fi
          done

name: seedance-product-scene
version: "1.0"
description: >
  Beginner-friendly product marketing pipeline. Generates four style previews,
  lets the user choose one to three complete styles, then produces Seedream
  scene images, a three-shot Seedance video, three Codex-authored copy variants,
  and a user-approved royalty-free music mix for every selected style.
category: custom
stability: beta
default_checkpoint_policy: guided

orchestration:
  mode: executive-producer
  skill: pipelines/seedance-product-scene/executive-producer
  max_revisions_per_stage: 3
  max_send_backs: 3
  max_wall_time_minutes: 45

extensions:
  custom_scripts: false
  custom_playbooks: false
  custom_skills: true
  custom_tools: false

required_skills:
  - pipelines/seedance-product-scene/executive-producer
  - pipelines/seedance-product-scene/idea-director
  - pipelines/seedance-product-scene/proposal-director
  - pipelines/seedance-product-scene/scene-director
  - pipelines/seedance-product-scene/asset-director
  - pipelines/seedance-product-scene/video-director
  - pipelines/seedance-product-scene/copy-director
  - pipelines/seedance-product-scene/music-director
  - pipelines/seedance-product-scene/compose-director
  - pipelines/seedance-product-scene/publish-director
  - meta/reviewer
  - meta/checkpoint-protocol

compatible_playbooks:
  recommended: []
  also_works:
    - clean-professional
    - premium-minimalist
  custom_allowed: true

metadata:
  text_generation: codex_active_session
  image_generation: ark_seedream
  video_generation: ark_seedance
  motion_required: true
  default_duration_seconds: 8
  default_ratio: "9:16"
  default_resolution: "720p"
  storyboard: three_shot
  burned_text: false
  preview_style_count: 4
  selected_style_min: 1
  selected_style_max: 3
  images_per_style: 3
  videos_per_style: 1
  copy_variants_per_style: 3
  music_candidates_per_style: 3

stages:
  - name: idea
    skill: pipelines/seedance-product-scene/idea-director
    produces:
      - brief
    tools_available: []
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Product image exists and is large enough to judge product details
      - Product name and known selling points are recorded without invented claims
      - Target platform, audience, and default 9:16 output are clear
    success_criteria:
      - Schema-valid brief artifact
      - Product image path resolves to a local file
      - User has approved the supplied product facts

  - name: proposal
    skill: pipelines/seedance-product-scene/proposal-director
    required_artifacts_in:
      - brief
    produces:
      - proposal_packet
      - decision_log
    tools_available: []
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Four preview styles are offered before complete generation
      - User may choose 1–3 complete styles after preview
      - 成本必须明确列出，未知价格必须先向用户报价
      - 音乐使用三条 Pixabay 候选并等待用户试听选择
      - 文案 uses three approved variants and the active Codex model
      - No text, subtitle, CTA, or logo is burned into the video
    success_criteria:
      - Schema-valid proposal_packet
      - Approval covers preview budget and selected-style range
      - Cost estimate lists image, video, and music handling without guessing unknown prices

  - name: style_preview
    skill: pipelines/seedance-product-scene/scene-director
    required_artifacts_in:
      - proposal_packet
    produces:
      - asset_manifest
    required_tools:
      - seedream_ark_image
    tools_available:
      - seedream_ark_image
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Exactly four style previews are generated with one image each
      - Product identity, proportions, label, and packaging remain stable
      - The user selects one to three complete styles
    success_criteria:
      - Schema-valid asset_manifest
      - Four preview files exist
      - User selection is recorded in the decision log

  - name: scene_plan
    skill: pipelines/seedance-product-scene/scene-director
    required_artifacts_in:
      - proposal_packet
      - asset_manifest
    produces:
      - scene_plan
    tools_available: []
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Every selected style has a three-shot storyboard
      - Scene motion adapts to the selected visual style
      - Shot timing covers 0–3, 3–6, and 6–8 seconds
      - Image prompts preserve the product and do not add unsupported text
    success_criteria:
      - Schema-valid scene_plan
      - Each selected style has exactly three planned shots
      - Duration and ratio match the approved proposal

  - name: assets
    skill: pipelines/seedance-product-scene/asset-director
    required_artifacts_in:
      - scene_plan
    produces:
      - asset_manifest
    required_tools:
      - seedream_ark_image
    tools_available:
      - seedream_ark_image
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Three scene candidates exist for each selected style
      - Product shape, label, color, and packaging remain faithful
      - The user selects one candidate for each style
    success_criteria:
      - Schema-valid asset_manifest
      - All image files exist
      - Exactly one selected image exists per selected style

  - name: video_assets
    skill: pipelines/seedance-product-scene/video-director
    required_artifacts_in:
      - scene_plan
      - asset_manifest
    produces:
      - asset_manifest
    required_tools:
      - seedance_ark
    tools_available:
      - seedance_ark
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Every video uses the user-approved scene image
      - Duration is 8 seconds, ratio 9:16, resolution 720p unless re-approved
      - Three-shot motion is visible and product continuity is acceptable
      - Failed tasks preserve task IDs without duplicate submission
    success_criteria:
      - Schema-valid asset_manifest
      - One approved video file exists per selected style
      - All video files pass ffprobe validation

  - name: copy
    skill: pipelines/seedance-product-scene/copy-director
    required_artifacts_in:
      - asset_manifest
    produces:
      - product_copy
    tools_available: []
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - 种草型, 高级型, and 详情页转化型 are all present per style
      - Copy uses only supplied product facts
      - Unsupported claims are absent or recorded as assumptions
      - Generation source is the active Codex session
    success_criteria:
      - Schema-valid product_copy
      - Every selected style has exactly three copy variants
      - User approves the copy set

  - name: music
    skill: pipelines/seedance-product-scene/music-director
    required_artifacts_in:
      - asset_manifest
      - product_copy
    produces:
      - product_delivery
    required_tools:
      - pixabay_music
    tools_available:
      - pixabay_music
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Each selected style has three previewed Pixabay candidates
      - Only the user-approved candidate is downloaded
      - Title, artist, and license are recorded
      - No automatic first-result selection
    success_criteria:
      - Draft product_delivery lists three candidates per style
      - Exactly one approved music file exists per style
      - Every approved track has a non-empty license

  - name: compose
    skill: pipelines/seedance-product-scene/compose-director
    required_artifacts_in:
      - asset_manifest
      - product_copy
      - product_delivery
    produces:
      - render_report
      - final_review
    required_tools:
      - audio_mixer
      - video_compose
    tools_available:
      - audio_mixer
      - video_compose
      - video_trimmer
      - audio_enhance
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - Music is mixed into each approved video without burned text
      - Final videos remain 8 seconds and 9:16
      - Output files exist under renders/<style>/final.mp4
      - ffprobe validates video and audio streams
    success_criteria:
      - Schema-valid render_report
      - Schema-valid final_review
      - All final videos pass ffprobe

  - name: publish
    skill: pipelines/seedance-product-scene/publish-director
    required_artifacts_in:
      - render_report
      - final_review
      - product_delivery
    produces:
      - product_delivery
      - publish_log
    tools_available: []
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Delivery includes all selected-style images, videos, copy, and licenses
      - Product claims match user-supplied facts
      - Final paths resolve inside the project directory
    success_criteria:
      - Schema-valid product_delivery
      - Schema-valid publish_log
      - User approves the final delivery inventory

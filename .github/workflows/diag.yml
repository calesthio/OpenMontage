name: diag
on:
  push:
    branches: [arena/54180390-openmontage]
    paths: ['diag-trigger.txt']
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect diagnostics into the repo
        run: |
          mkdir -p .diagnostics
          F=.diagnostics/report.txt
          {
            echo "run: $GITHUB_RUN_ID  $(date -u)"
            echo
            echo "== curl: can we reach the outside internet? =="
            for u in https://api.netlify.com/api/v1 https://api.cloudflare.com/client/v4 \
                     https://api.vercel.com https://tiiny.host https://surge.sh \
                     https://neocities.org https://ipfs.io https://cdn.jsdelivr.net \
                     https://raw.githack.com https://pypi.org https://registry.npmjs.org; do
              printf "%-45s %s\n" "$u" "$(curl -s -o /dev/null -w '%{http_code}' -m 12 "$u")"
            done
            echo
            echo "== repo actions permissions =="
            curl -s -H "Authorization: Bearer $GITHUB_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/permissions"; echo
            echo "== pages: existing? =="
            curl -s -o /dev/null -w "GET /pages -> %{http_code}\n" -H "Authorization: Bearer $GITHUB_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages"
            echo "== pages: try enable (build_type=workflow) =="
            curl -s -w "\n-> %{http_code}\n" -X POST -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages" \
              -d '{"build_type":"workflow"}'
            echo "== pages: try enable (legacy source=main) =="
            curl -s -w "\n-> %{http_code}\n" -X POST -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages" \
              -d '{"source":{"branch":"arena/54180390-openmontage","path":"/a1-tour-and-travels"}}'
            echo
            echo "== can the runner push back to this repo? =="
            git config user.name "diag-bot"
            git config user.email "diag@users.noreply.github.com"
            echo "probe $(date -u +%s)" > .diagnostics/push-probe.txt
            git add .diagnostics/push-probe.txt
            git commit -q -m "diag: push probe" && echo "commit: ok" || echo "commit: failed"
            git push origin HEAD:arena/54180390-openmontage 2>&1 | tail -3 && echo "push: ok" || echo "push: failed"
          } > /tmp/out.txt 2>&1
          cat /tmp/out.txt
          cp /tmp/out.txt .diagnostics/report.txt
          git add .diagnostics/report.txt
          git commit -q -m "diag: report $GITHUB_RUN_ID" || echo "nothing to commit"
          git push origin HEAD:arena/54180390-openmontage 2>&1 | tail -3

name: archive submissions

# Puts every published page into the Internet Archive (free, permanent, account-free).
on:
  push:
    branches: [arena/54180390-openmontage]
    paths: ['archive-trigger.txt']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Submit every page to the Wayback Machine
        run: python3 .github/scripts/archive_submit.py

      - name: Commit results
        run: |
          BR=arena/54180390-openmontage
          git config user.name site-bot
          git config user.email site-bot@users.noreply.github.com
          git add -f .diagnostics
          git commit -q -m "marketing: Wayback Machine submissions for all pages" || echo "no changes"
          for a in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "$BR" >/dev/null 2>&1 && git push origin HEAD:"$BR" 2>&1 | tail -1; then
              echo "push $a OK"; break
            else
              sleep 6
            fi
          done

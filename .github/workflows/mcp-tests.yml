name: MCP integration tests

on:
  pull_request:
    paths:
      - 'integrations/mcp_server/**'
      - 'tests/mcp/**'
      - 'lib/**'
      - 'tools/**'
      - 'requirements.txt'
      - '.github/workflows/mcp-tests.yml'
  push:
    branches:
      - main
      - 'feature/chatgpt-mcp'
    paths:
      - 'integrations/mcp_server/**'
      - 'tests/mcp/**'
      - 'lib/**'
      - 'tools/**'
      - 'requirements.txt'
      - '.github/workflows/mcp-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'mcp[cli]>=1.9.0,<2.0.0' pyyaml jsonschema pytest
      - name: Run MCP contract tests
        run: python -m pytest -q tests/mcp
